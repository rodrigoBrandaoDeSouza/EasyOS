# Produção em uma única VPS Linux (2 vCPU / 4 GB atende ~50 clientes com folga).
# Uso: cp .env.example .env && (edite) && docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - easyos-data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PLATFORM_HOST: ${PLATFORM_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  easyos-data:
  caddy-data:
  caddy-config:
